name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.check_name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match the release toolchains for Electron's native SQLite module and Mac signing.
          - runner: windows-2022
            check_name: windows-2022
            platform: windows
            arch: x64
          - runner: macos-15
            check_name: macos-latest
            platform: mac
            arch: arm64
            builder_args: --mac dmg --arm64
          - runner: macos-15-intel
            check_name: macos-15-intel
            platform: mac
            arch: x64
            builder_args: --mac dmg --x64
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:store
      - run: npm run test:e2e
      - name: Build Mac preview installer
        if: matrix.platform == 'mac'
        run: npm exec --workspace=@pomodoro/desktop -- electron-builder ${{ matrix.builder_args }} --publish never
      - name: Test Mac packaging signatures
        if: matrix.platform == 'mac'
        run: npm run test:packaging
      - name: Verify and smoke-test the final Mac installer
        if: matrix.platform == 'mac'
        run: node scripts/smoke-mac-dmg.mjs apps/desktop/dist/*.dmg
      - name: Upload Mac preview installer
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: preview-installers-mac-${{ matrix.arch }}
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/test-results/**
            apps/desktop/dist/builder-effective-config.yaml
          if-no-files-found: ignore
