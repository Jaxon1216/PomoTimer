name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Match the release runner's Visual Studio 2022 toolchain for Electron's native SQLite module.
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
            builder_args: --mac dmg --arm64
          - os: windows-2022
            platform: windows
            arch: x64
            builder_args: --win nsis --x64
          - os: macos-15-intel
            platform: mac
            arch: x64
            builder_args: --mac dmg --x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # The custom ad hoc signer needs no credentials and is safe for pull requests.
      CSC_FOR_PULL_REQUEST: "true"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:store
      - run: npm run test:e2e
      - name: Build final installer
        run: npm exec --workspace=@pomodoro/desktop -- electron-builder ${{ matrix.builder_args }} --publish never
      - name: Verify macOS signatures and reject tampering
        if: runner.os == 'macOS'
        run: npm run test:packaging
      - name: Install and verify final macOS DMG
        if: runner.os == 'macOS'
        run: |
          pomodot_version="$(node -p "require('./apps/desktop/package.json').version")"
          node scripts/smoke-mac-dmg.mjs "apps/desktop/dist/Pomodot-${pomodot_version}-mac-${{ matrix.arch }}.dmg"
      - name: Install and verify final Windows installer
        if: runner.os == 'Windows'
        run: node scripts/smoke-windows-installer.mjs
      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: apps/desktop/test-results/**
          if-no-files-found: ignore
